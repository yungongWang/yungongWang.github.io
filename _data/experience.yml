#   role     - your position / title there, shown in italics under the heading
#   period   - e.g. "Jul 2025 – Sep 2025"
#   location - e.g. "Beijing, China" or "Remote"
#   image    - optional preview image, path relative to site root
#              (delete the line entirely if you don't have one for this entry)
#   bullets  - list of 2-4 short bullet points describing what you did
#   links    - optional list of {label, url} pairs, rendered as small pill buttons
#              (delete the whole `links:` block if there's nothing to link)

